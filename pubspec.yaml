name: flutter_material_enterprise_starter
description: "A production-ready Enterprise Flutter Starter Template built with Material 3, Clean Architecture, and Riverpod."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing & Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0

  # Local Storage & Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.21
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Functional Programming & Utilities
  fpdart: ^1.1.0
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  drift_dev: ^2.16.0
  freezed: ^2.5.2
  freezed_annotation: ^2.4.1
  json_serializable: ^6.8.0
  json_annotation: ^4.9.0

flutter:
  uses-material-design: true

