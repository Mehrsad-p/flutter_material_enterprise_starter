name: flutter_material_enterprise_starter
description: "A production-ready Enterprise Flutter Starter Template built with Material 3, Clean Architecture, and Riverpod."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  dio: ^5.8.0+1
  retrofit: 4.8.0

  drift: ^2.22.1

  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  go_router: ^17.3.0

dev_dependencies:
  build_runner: ^2.4.15

  riverpod_generator: ^2.6.5

  retrofit_generator: 9.7.0

  drift_dev: ^2.22.1

  freezed: ^3.0.6

  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true

