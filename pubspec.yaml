name: flutter_material_enterprise_starter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^17.3.0
  freezed: ^3.1.0
  freezed_annotation: ^3.1.0
  json_serializable: ^6.9.5
  build_runner: ^2.5.4
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^2.6.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: IRANSans
      fonts:
        - asset: assets/fonts/IRANSans-Regular.ttf
        - asset: assets/fonts/IRANSans-Bold.ttf
          weight: 700
    - family: IRANYekanX
      fonts:
        - asset: assets/fonts/IRANYekanX-Regular.ttf
        - asset: assets/fonts/IRANYekanX-Bold.ttf
          weight: 700
